sonar.projectKey=master-gateway
sonar.projectName=Master Gateway

sonar.sources=backend/src
sonar.tests=backend
sonar.exclusions=**/node_modules/**,**/dist/**
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/main.ts,**/dist/**,**/node_modules/**
sonar.sourceEncoding=UTF-8
sonar.verbose=false